<app-header></app-header>
<div class="app-body">
    <app-sidebar></app-sidebar>
    <main class="main">
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">Início</li>
                <li class="breadcrumb-item">Configurações</li>
                <li class="breadcrumb-item">Corretora, Usuários</li>
                <li class="breadcrumb-item">Unidades de Negócio</li>
                <li class="breadcrumb-menu d-md-down-none">
                    <div class="btn-group" role="group" aria-label="Button group">
                        <a class="btn">
                            <i class="fas fa-question mr-2"></i>Ajuda
                        </a>
                    </div>
                </li>
            </ol>
            <div class="container-fluid">
                <div class="animated fadeIn">
                    <div class="row align-items-center mb-3">
                        <div class="col">
                            <h4><i class="fas fa-cog mr-2"></i>Unidades de Negócio</h4>
                        </div>
                        <div class="col-auto">
                            <div class="btn-group">
                                <button class="btn btn-dark" (click)="voltar()">
                                    <i class="fas fa-arrow-alt-circle-left mr-2"></i>Voltar
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="alert alert-{{feedback.tipo}}" *ngIf="feedback">
                        {{ feedback.mensagem }}
                    </div>
                    <div class="card card-accent-crm">
                        <div class="card-header">
                            <strong><i class="fas fa-edit"></i></strong>
                        </div>
                        <div class="card-body">
                            <div class="form-row">
                                <div class="col-lg-12">
                                    <div class="form-group">
                                        <label>Nome:</label>
                                        <input formControlName="nome" class="form-control">
                                    </div>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="col-lg-4">
                                    <div class="form-group">
                                        <label>Responsável:</label>
                                        <input formControlName="responsavel" class="form-control">
                                    </div>
                                </div>
                                <div class="col-lg-4">
                                    <div class="form-group">
                                        <label>Susep:</label>
                                        <input formControlName="susep" class="form-control">
                                    </div>
                                </div>
                                <div class="col-lg-4">
                                    <div class="form-group">
                                        <label>Email:</label>
                                        <input formControlName="email" class="form-control">
                                    </div>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="col-lg-2">
                                    <div class="form-group">
                                        <label>CEP:</label>
                                        <input formControlName="cep" class="form-control">
                                    </div>
                                </div>
                                <div class="col-lg-8">
                                    <div class="form-group">
                                        <label>Endereço:</label>
                                        <input formControlName="endereco" class="form-control">
                                    </div>
                                </div>
                                <div class="col-lg-2">
                                    <div class="form-group">
                                        <label>Número:</label>
                                        <input formControlName="numero" class="form-control">
                                    </div>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="col-lg-3">
                                    <div class="form-group">
                                        <label>Complemento:</label>
                                        <input formControlName="complemento" class="form-control">
                                    </div>
                                </div>
                                <div class="col-lg-3">
                                    <div class="form-group">
                                        <label>Bairro:</label>
                                        <input formControlName="bairro" class="form-control">
                                    </div>
                                </div>
                                <div class="col-lg-3">
                                    <div class="form-group">
                                        <label>Cidade:</label>
                                        <input formControlName="cidade" class="form-control">
                                    </div>
                                </div>
                                <div class="col-lg-3">
                                    <div class="form-group">
                                        <label>Estado:</label>
                                        <input formControlName="estado" class="form-control">
                                    </div>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="col-lg-4">
                                    <div class="form-group">
                                        <label>Telefone 1:</label>
                                        <input formControlName="telefone1"class="form-control">
                                    </div>
                                </div>
                                <div class="col-lg-4">
                                    <div class="form-group">
                                        <label>Telefone 2:</label>
                                        <input formControlName="telefone2" class="form-control">
                                    </div>
                                </div>
                                <div class="col-lg-4">
                                    <div class="form-group">
                                        <label>Celular:</label>
                                        <input formControlName="celular" class="form-control">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer">
                            <div class="text-center">
                                <div class="btn-group">
                                    <button type="submit" class="btn btn-success">
                                        Incluir unidade de negócio
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </main>
</div>
<app-footer></app-footer>
